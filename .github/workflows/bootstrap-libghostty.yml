name: LibGhostty bootstraps

on:
  push:
    branches:
      - master
    paths:
      - 'packages/**'
      - 'root-packages/**'
      - 'x11-packages/**'
      - 'scripts/**'
      - 'repo.json'
      - '.github/workflows/bootstrap-libghostty.yml'
  workflow_dispatch:

concurrency:
  group: libghostty-bootstraps
  cancel-in-progress: true

jobs:
  source-preflight:
    name: Validate critical source mirrors
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Preflight all bootstrap dependency sources
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/preflight-bootstrap-sources.sh

  builder-image:
    name: Build shared package-builder image
    needs: source-preflight
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      BUILDER_IMAGE: ghcr.io/${{ github.repository_owner }}/termux-libghostty-builder:${{ github.sha }}
      BUILDER_IMAGE_LATEST: ghcr.io/${{ github.repository_owner }}/termux-libghostty-builder:latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish shared package-builder image
        uses: docker/build-push-action@v6
        with:
          context: scripts
          file: scripts/Dockerfile
          push: true
          tags: |
            ${{ env.BUILDER_IMAGE }}
            ${{ env.BUILDER_IMAGE_LATEST }}
          cache-from: type=gha,scope=libghostty-builder
          cache-to: type=gha,mode=max,scope=libghostty-builder

  build:
    name: Build ${{ matrix.arch }} bootstrap
    needs: [source-preflight, builder-image]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull shared package-builder image
        env:
          BUILDER_IMAGE: ghcr.io/${{ github.repository_owner }}/termux-libghostty-builder:${{ github.sha }}
        run: docker pull "$BUILDER_IMAGE"

      - name: Build bootstrap from local package sources
        env:
          TERMUX_BUILDER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/termux-libghostty-builder:${{ github.sha }}
          CONTAINER_NAME: termux-libghostty-builder-${{ matrix.arch }}
        run: ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures "${{ matrix.arch }}"

      - name: Store bootstrap archive
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-${{ matrix.arch }}
          path: bootstrap-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    name: Publish bootstrap release
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Fetch bootstrap archives
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: ./

      - name: Publish stable bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view bootstrap-libghostty-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit bootstrap-libghostty-latest \
              --repo "${GITHUB_REPOSITORY}" \
              --title "LibGhostty bootstrap archives (android-7)" \
              --notes "Built from ${GITHUB_SHA}."
          else
            gh release create bootstrap-libghostty-latest \
              --repo "${GITHUB_REPOSITORY}" \
              --title "LibGhostty bootstrap archives (android-7)" \
              --notes "Built from ${GITHUB_SHA}." \
              --latest=false
          fi
          gh release upload bootstrap-libghostty-latest bootstrap-*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
